<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>작은 하루 · 캐릭터 시계</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { position: fixed; inset: 0; background: transparent; color: #46423f; font-family: "Segoe UI Variable", "Segoe UI", "Malgun Gothic", sans-serif; }
  .clock { --accent: #8f986f; --wash: #f1f4e9; --line: #e6e9dc; --muted: #737b60; position: absolute; left: 50%; top: 50%; width: 356px; transform: translate(-50%, -50%) scale(var(--widget-scale, 0)); transform-origin: center; overflow: hidden; padding: 24px 25px 18px; border: 1px solid #eae6df; border-radius: 30px; background: #fffcf7; box-shadow: 0 9px 32px #65543f0b, inset 0 0 0 5px #ffffff7a; transition: border-color .6s; }
  .clock[data-phase="night"] { --accent: #9386ad; --wash: #f0ecf6; --line: #e7e0ef; --muted: #80738f; }
  .clock[data-phase="rest"] { --accent: #bb8e75; --wash: #fbefe4; --line: #eedfd2; --muted: #9b7965; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-size: 10px; font-weight: 650; letter-spacing: 2.1px; color: #847b72; }
  .phase-tag { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--wash); color: var(--muted); font-size: 10px; font-weight: 600; white-space: nowrap; }
  .phase-icon { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .scene { position: relative; display: grid; place-items: center; height: 220px; margin: 15px -7px 0; }
  .scene::before { content: ""; position: absolute; width: 205px; height: 187px; border-radius: 47% 53% 42% 58% / 55% 45% 55% 45%; background: var(--wash); z-index: 0; transition: background .6s; }
  .character { position: absolute; z-index: 1; width: 268px; max-width: 100%; height: 220px; object-fit: contain; mix-blend-mode: multiply; opacity: 0; visibility: hidden; transition: opacity .6s; }
  .character[data-image="night"] { width: 244px; height: 214px; transform: rotate(-4deg); }
  .character[data-image="rest"] { width: 268px; height: 268px; }
  .character[data-image="day"] { width: 100%; height: 204px; border-radius: 42% 48% 43% 45%; mask-image: radial-gradient(ellipse 65% 63% at 50% 50%, #000 55%, transparent 94%); }
  .clock[data-phase="night"] [data-image="night"], .clock[data-phase="day"] [data-image="day"], .clock[data-phase="rest"] [data-image="rest"] { opacity: 1; visibility: visible; }
  /* 현재 시간대의 이미지만 움직여 숨겨진 이미지의 애니메이션은 멈춥니다. */
  .sleep-eye { transform-box: view-box; }
  .sleep-eye-left { transform-origin: 284px 164px; }
  .sleep-eye-right { transform-origin: 356px 190px; }
  .sleep-lid { opacity: 0; }
  .clock[data-phase="night"] .sleep-eye { animation: sleepy-blink 5.2s ease-in-out infinite; }
  .clock[data-phase="night"] .sleep-lid { animation: sleepy-lid 5.2s ease-in-out infinite; }
  .picking-arm { transform-origin: 250px 226px; }
  .clock[data-phase="day"] .picking-arm { animation: pick-grass 3.2s ease-in-out infinite; }
  .clock[data-phase="rest"] [data-image="rest"] { transform-origin: 50% 75%; animation: happy-bounce 3s ease-in-out infinite; }
  @keyframes sleepy-blink {
    0%, 58%, 82%, 100% { transform: scaleY(1); opacity: 1; }
    64%, 76% { transform: scaleY(.04); opacity: 0; }
  }
  @keyframes sleepy-lid {
    0%, 60%, 80%, 100% { opacity: 0; }
    64%, 76% { opacity: 1; }
  }
  @keyframes pick-grass {
    0%, 86%, 100% { transform: translate(0, 0) rotate(0); }
    22% { transform: translate(0, 3px) rotate(7deg); }
    38% { transform: translate(0, 2px) rotate(5deg); }
    52%, 62% { transform: translate(0, -7px) rotate(-13deg); }
  }
  @keyframes happy-bounce {
    0%, 85%, 100% { transform: translateY(0) rotate(0) scale(1); }
    18% { transform: translateY(2px) rotate(0) scale(1.012, .988); }
    42% { transform: translateY(-6px) rotate(-2deg) scale(.995, 1.005); }
    66% { transform: translateY(-1px) rotate(1deg) scale(1); }
  }
  .spark { position: absolute; z-index: 2; color: var(--accent); font-family: Georgia, serif; font-size: 17px; opacity: .7; }
  .spark.one { left: 17px; top: 41px; transform: rotate(-12deg); }
  .spark.two { right: 15px; top: 150px; font-size: 12px; }
  .greeting { margin: 2px 0 8px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .35px; }
  .time-row { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .time { font-size: 73px; font-weight: 600; line-height: 1.1; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .colon { display: inline-block; transform: translateY(-4px); padding: 0 2px; font-weight: 400; color: var(--accent); }
  .seconds { align-self: flex-end; margin-bottom: 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
  .seconds span { font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; line-height: 1; }
  .seconds small { font-size: 7px; letter-spacing: 1px; }
  .date { text-align: center; margin: 11px 0 19px; font-size: 11px; letter-spacing: 1.2px; color: #8b8178; }
  .week { display: flex; justify-content: space-between; padding-top: 15px; border-top: 1px solid var(--line); }
  .weekday { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; color: #9b938a; font-size: 10px; }
  .weekday[aria-current="date"] { background: var(--wash); color: var(--muted); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }
  .bottomline { margin-top: 17px; display: flex; justify-content: space-between; align-items: center; color: #9b9084; font-size: 8px; letter-spacing: 1px; }
  .little-heart { color: var(--accent); font-size: 11px; }
  .credit-link { display: block; margin-top: 13px; text-align: center; color: #aaa095; font-size: 7px; text-decoration: none; letter-spacing: .1px; }
  .credit-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  .preview-label { position: absolute; top: 0; left: 50%; transform: translateX(-50%); padding: 2px 8px; background: var(--wash); border-radius: 0 0 6px 6px; color: var(--muted); font-size: 7px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>

  const pad = value => String(value).padStart(2, '0');
  const formatter = new Intl.DateTimeFormat('en-GB', { timeZone: KST, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const previewValue = new URLSearchParams(location.search).get('preview');
  // 검토용: ?preview=23:08 / ?preview=14:25 / ?preview=19:10. 기본은 실시간.
  const preview = /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(previewValue || '') ? previewValue : null;
  document.querySelector('.preview-label').hidden = !preview;
  const phases = {
    night: { label: '포근한 밤', greeting: '오늘도 수고했어, 좋은 꿈 꿔', icon: 'M13 10A6 6 0 0 1 6 2a6 6 0 1 0 7 8Z' },
    day: { label: '낮의 작은 순간', greeting: '오늘도 나의 속도로, 차근차근', icon: 'M8 1v1m0 12v1M1 8h1m12 0h1M3 3l1 1m8 8 1 1M3 13l1-1m8-8 1-1M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0' },
    rest: { label: '잠깐, 쉬어가기', greeting: '조금 느긋해도 괜찮아', icon: 'M2 9a6 6 0 0 1 12 0M1 10h14M4 13h8M8 1v2M2 4l1 1m10 0 1-1' }
  };
  function getPhase(hour) {
    if (hour >= 22 || hour < 6) return 'night';
    if (hour >= 9 && hour < 18) return 'day';
    return 'rest';
  }
  function getISOWeek(y, m, d) {
    const t = new Date(Date.UTC(y, m - 1, d));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }
  function tick() {
    const parts = Object.fromEntries(formatter.formatToParts(new Date()).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
    if (preview) { [parts.hour, parts.minute] = preview.split(':'); parts.second = '00'; }
    const { year, month, day, hour, minute, second } = parts;
    set('hh', hour); set('mm', minute); set('ss', second);
    $('clock-time').dateTime = `${year}-${month}-${day}T${hour}:${minute}:${second}+09:00`;
    $('clock-time').setAttribute('aria-label', `${Number(hour)}시 ${Number(minute)}분`);
    set('date', `${year}. ${month}. ${day}`);
    set('wk', pad(getISOWeek(+year, +month, +day)));
    const weekday = new Date(Date.UTC(+year, +month - 1, +day)).getUTCDay();
    for (const element of document.querySelectorAll('.weekday')) {
      if (+element.dataset.weekday === weekday) element.setAttribute('aria-current', 'date');
      else element.removeAttribute('aria-current');
    }
    const phase = getPhase(+hour);
    if (clock.dataset.phase !== phase || !clock.dataset.ready) {
      clock.dataset.phase = phase;
      clock.dataset.ready = 'true';
      set('phase-label', phases[phase].label);
      set('greeting', phases[phase].greeting);
      $('phase-icon-path').setAttribute('d', phases[phase].icon);
      for (const image of document.querySelectorAll('.character')) image.setAttribute('aria-hidden', String(image.dataset.image !== phase));
    }
  }
  function loop() { tick(); setTimeout(loop, 1000 - Date.now() % 1000); }
  loop();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
<script>
// 카드의 원래 크기로 비율을 계산하므로 애니메이션이나 확대가 재측정을 반복하지 않습니다.
(() => {
  const card = document.querySelector('.clock');
  const viewport = document.documentElement;
  let pendingFrame = 0;
  function fitWidget() {
    pendingFrame = 0;
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    const cardWidth = card.offsetWidth;
    const cardHeight = card.offsetHeight;
    if (!width || !height || !cardWidth || !cardHeight) return;
    const gutter = Math.min(16, width * .04, height * .04);
    const scale = Math.min((width - gutter * 2) / cardWidth, (height - gutter * 2) / cardHeight);
    card.style.setProperty('--widget-scale', String(scale));
  }
  function scheduleFit() {
    if (!pendingFrame) pendingFrame = requestAnimationFrame(fitWidget);
  }
  if ('ResizeObserver' in window) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(viewport);
    observer.observe(card);
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('pageshow', scheduleFit);
  document.addEventListener('visibilitychange', scheduleFit);
  if (document.fonts) document.fonts.ready.then(scheduleFit);
  fitWidget();
})();
</script>
</body>
